<!DOCTYPE html>
<html>
<head>
  <title>CS Quest - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <div class="lang-switch">
</div>
  <style>

 .lang-select {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;

  background: #0b0f2f;
  color: #00e5ff;

  border: 2px solid #7c4dff;
  box-shadow: 0 0 10px #7c4dff;

  padding: 6px 8px;

  cursor: pointer;
  outline: none;

  transition: 0.2s ease;
}

/* when clicked / focused */
.lang-select:focus {
  border-color: #00e5ff;
  box-shadow:
    0 0 12px #00e5ff,
    0 0 24px #7c4dff;
  transform: scale(1.05);
}

/* hover glow */
.lang-select:hover {
  box-shadow:
    0 0 10px #7c4dff,
    0 0 20px #00e5ff;
}
    .lang-switch {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 10px;
}

.lang-switch button {
  font-size: 8px;
  padding: 6px 10px;
  border: 2px solid #00e5ff;
  background: #0b0f2f;
  color: #caa6ff;
  cursor: pointer;
}

.lang-switch button:hover {
  box-shadow: 0 0 10px #00e5ff;
}
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
  --bg:        #0b0f2f;
  --bg2:       #1a0b3d;
  --neon-blue: #00e5ff;
  --neon-pink: #ff4dff;
  --neon-purple: #7c4dff;
  --neon-gold: #f5c842;
  --text:      #caa6ff;
  --danger:    #ff4d4d;

  --ef: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}

    body {
  margin: 0;
  font-family: 'Press Start 2P', monospace;
  background: linear-gradient(135deg, #0b0f2f, #1a0b3d, #0a1b3f);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

    /* ── Topbar ── */
    .topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;

  background: rgba(20, 10, 50, 0.9);
  border-bottom: 2px solid var(--neon-purple);

  box-shadow:
    0 0 10px var(--neon-purple),
    0 0 20px rgba(0,229,255,0.3);

  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
}
    .topbar.visible { opacity: 1; }
    .logo {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--neon-blue);
  text-shadow:
    0 0 8px var(--neon-purple),
    0 0 16px var(--neon-blue);
}
    .topbar-stats { display: flex; gap: 10px; align-items: center; }
    .stat-pill {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  background: #0b0f2f;
  border-radius: 10px;
  padding: 6px 10px;
}

.stat-pill.xp {
  border: 2px solid var(--neon-blue);
  color: var(--neon-blue);
  box-shadow: 0 0 10px var(--neon-blue);
}

.stat-pill.fire {
  border: 2px solid var(--danger);
  color: var(--danger);
  box-shadow: 0 0 10px var(--danger);
}
    .nav-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg2); border: 2px solid var(--gray);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; transition: border-color .2s;
      font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    }
    .nav-avatar:hover { border-color: var(--gold); }
    .logout-btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;

  background: transparent;
  border: 2px solid var(--neon-pink);
  color: var(--neon-pink);

  box-shadow: 0 0 10px var(--neon-pink);
}

.logout-btn:hover {
  background: var(--neon-pink);
  color: black;
  box-shadow: 0 0 20px var(--neon-pink);
}

    /* ── Page wrapper ── */
    .page {
      padding-top: 72px;
      padding-bottom: 40px;
    }

    /* ── Welcome card ── */
    .welcome-card {
  background: rgba(20, 10, 50, 0.85);
  border: 2px solid var(--neon-purple);
  box-shadow:
    0 0 20px var(--neon-purple),
    0 0 30px rgba(0,229,255,0.2);

  border-radius: 14px;
}
    .welcome-emoji {
      font-size: 36px;
      font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    }
    .welcome-name { font-size: 15px; font-weight: 900; color: #fff; }
    .welcome-sub  { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }

    /* ── Horizontal scroll track ── */
    /*
      The path is drawn on a tall canvas that scrolls horizontally.
      Each "row" of coins is a horizontal band. Rows alternate
      left-to-right and right-to-left to create the snake.
    */
    .path-scroll {
  width: 100%;
  overflow-x: auto;
  overflow-y: visible;

  display: flex;
  justify-content: center;   /* 👈 THIS centers the canvas */

  padding: 20px 0 40px;
}
    .path-scroll::-webkit-scrollbar { height: 4px; }
    .path-scroll::-webkit-scrollbar-track { background: transparent; }
    .path-scroll::-webkit-scrollbar-thumb { background: var(--gray); border-radius: 2px; }

    /* The actual canvas — wide enough for all nodes */
    .path-canvas {
      position: relative;
      /* width set by JS based on node count */
      min-height: 260px;
    }

    /* SVG connector lines drawn behind nodes */
    .path-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    /* ── Section label strip ── */
    .section-strip {
      position: absolute;
      display: flex; align-items: center; gap: 8px;
      background: var(--bg2);
      border: 2px solid #2e3448;
      border-radius: 10px;
      padding: 5px 12px;
      font-size: 11px; font-weight: 900; color: #fff;
      white-space: nowrap;
      pointer-events: none;
    }
    .section-strip-icon {
      font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
      font-size: 14px;
    }

    /* ── COIN ── */
    .coin {
      position: absolute;
      width: 72px; height: 72px;
      border-radius: 50%;
      border: none; outline: none;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1px;
      transition: transform .12s ease;
      /* center the node on its (cx, cy) point */
      transform: translate(-50%, -50%);
    }

    .coin.done {
  background: linear-gradient(135deg, #7c4dff, #00e5ff);
  box-shadow:
    0 0 10px #7c4dff,
    0 0 20px #00e5ff;
}

.coin.available {
  background: linear-gradient(135deg, #ff4dff, #00e5ff);
  box-shadow:
    0 0 15px #ff4dff,
    0 0 25px #00e5ff;
  animation: pulseGlow 1.5s infinite;
}

.coin.locked {
  background: #1a1d2a;
  border: 2px solid #333;
  opacity: 0.6;
}

    .coin-icon {
      font-size: 24px; line-height: 1;
      font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    }
    .coin-label {
      position: absolute; top: calc(100% + 8px);
      left: 50%; transform: translateX(-50%);
      font-size: 10px; font-weight: 900;
      white-space: nowrap; color: var(--muted);
      pointer-events: none;
    }
    .coin.done .coin-label,
    .coin.available .coin-label { color: var(--gold); }

    .check-badge {
      position: absolute; bottom: 2px; right: 2px;
      width: 20px; height: 20px;
      background: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #8b5e00; font-weight: 900;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
      pointer-events: none;
    }

    .start-bubble {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%; transform: translateX(-50%);
      background: #fff; color: #a87000;
      font-size: 9px; font-weight: 900;
      padding: 3px 10px; border-radius: 20px;
      white-space: nowrap; pointer-events: none;
      animation: bob .9s ease-in-out infinite;
    }
    .start-bubble::after {
      content: ''; position: absolute;
      top: 100%; left: 50%; transform: translateX(-50%);
      border: 4px solid transparent; border-top-color: #fff;
    }

    /* ── CHEST ── */
    .chest-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; cursor: pointer;
    }
    .chest-node.locked-chest { cursor: not-allowed; opacity: .6; }
    .chest-graphic { position: relative; width: 76px; height: 70px; }
    .chest-lid-el {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 72px; height: 30px;
      background: linear-gradient(180deg, #e89030, #b06018);
      border: 3px solid #5c2e08; border-radius: 9px 9px 0 0;
      transition: transform .2s;
    }
    .chest-body-el {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 72px; height: 46px;
      background: linear-gradient(180deg, #c87a20, #8b4c10);
      border: 3px solid #5c2e08; border-radius: 3px 3px 9px 9px;
      display: flex; align-items: center; justify-content: center;
    }
    .chest-body-el::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 9px;
      background: #5c2e08;
    }
    .chest-lock-el {
      width: 16px; height: 14px;
      background: var(--gold); border: 2px solid #8b5e00;
      border-radius: 50% 50% 4px 4px;
      position: relative; z-index: 1; margin-top: 3px;
    }
    .chest-lock-el::before {
      content: ''; position: absolute;
      top: -7px; left: 50%; transform: translateX(-50%);
      width: 9px; height: 9px;
      border: 3px solid #8b5e00;
      border-radius: 50% 50% 0 0; background: transparent;
    }
    .chest-node.available-chest .chest-lid-el {
      box-shadow: 0 0 0 3px var(--gold), 0 0 14px rgba(245,200,66,.5);
    }
    .chest-node.available-chest:hover .chest-lid-el {
      transform: translateX(-50%) rotate(-14deg) translateY(-7px);
    }
    .chest-node.done-chest .chest-lid-el { box-shadow: 0 0 0 2px var(--green); }
    .chest-label {
      font-size: 10px; font-weight: 900; color: var(--gold);
      margin-top: 28px; white-space: nowrap; pointer-events: none;
    }
    .chest-node.locked-chest .chest-label { color: var(--muted); }

    /* ── Mascot ── */
    .mascot {
      position: absolute;
      font-size: 52px; pointer-events: none;
      transform: translate(-50%, -50%);
      font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
      filter:
    drop-shadow(0 0 10px #00e5ff)
    drop-shadow(0 0 20px #7c4dff);
      animation: mascotBob 2.8s ease-in-out infinite;
    }

    /* ── Trophy ── */
    .trophy-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
    }
    .trophy-coin {
      width: 84px; height: 84px; border-radius: 50%;
      .trophy-coin {
  background: linear-gradient(135deg, #ff4dff, #00e5ff);
  box-shadow:
    0 0 20px #ff4dff,
    0 0 40px #00e5ff;
}
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    }
    .trophy-label {
      font-size: 10px; font-weight: 800; color: var(--muted);
      text-align: center; white-space: nowrap;
    }

    /* ── Animations ── */
    @keyframes popIn {
      0%   { transform: translate(-50%,-50%) scale(.5); opacity: 0; }
      65%  { transform: translate(-50%,-50%) scale(1.12); }
      100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    }
    @keyframes ring {
      0%,100% { box-shadow: 0 6px 0 var(--gold-dark), 0 0 0 0 rgba(245,200,66,.5); }
      60%      { box-shadow: 0 6px 0 var(--gold-dark), 0 0 0 14px rgba(245,200,66,0); }
    }
    @keyframes bob {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-5px); }
    }
    @keyframes mascotBob {
      0%,100% { transform: translate(-50%,-50%) rotate(-3deg) translateY(0); }
      50%      { transform: translate(-50%,-50%) rotate(3deg) translateY(-8px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
  0% { box-shadow: 0 0 10px #ff4dff; }
  50% { box-shadow: 0 0 25px #00e5ff; }
  100% { box-shadow: 0 0 10px #ff4dff; }
}
  </style>
</head>
<body>
    

<nav class="topbar" id="topbar">
  <div class="logo">CS QUEST</div>
  <div class="topbar-stats">
    <div class="stat-pill xp">⚡ <span id="xp-val">0</span></div>
    <div class="stat-pill fire">🔥 <span id="streak-val">0</span></div>
    <div class="nav-avatar" id="nav-avatar">🦊</div>
    <select id="langSelect" class="lang-select">
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="java">Java</option>
    </select>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>
</nav>

<div class="page">
  <div class="welcome-card" id="welcome-card">
    <div>
      <div class="welcome-name" id="welcome-name">Welcome back!</div>
    </div>
  </div>

  <div class="path-scroll" id="path-scroll">
    <div class="path-canvas" id="path-canvas">
      <svg class="path-svg" id="path-svg"></svg>
      <!-- nodes injected by JS -->
    </div>
  </div>
</div>

<script type="module" src="./home.js"></script>
</body>
</html>
