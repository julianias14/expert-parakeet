<!DOCTYPE html>
<html>
<head>
  <title>Auth App</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

  <h2>SIGN UP</h2>

  <input id="suEmail" placeholder="Email">
  <input id="suPassword" type="password" placeholder="Password">
  <input id="suName" placeholder="Name">
  <input id="suAge" placeholder="Age">
  <button id="signupBtn">Create Account</button>

  <hr>

  <h2>LOGIN</h2>

  <input id="liEmail" placeholder="Email">
  <input id="liPassword" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>

</div>
<div id="errorPopup" class="error-popup hidden"></div>

<script type="module" src="./login.js"></script>
</body>
</html>
