<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="game-container">

    <!-- Pet -->
    <div class="pet-section">
      <div class="pet-sprite" id="pet-face">🐣</div>
      <div class="pet-info">
        <div class="pet-name">Bitsy</div>
        <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar"></div></div>
        <div class="hp-label" id="hp-label">HP: 75 / 100</div>
      </div>
    </div>

    <!-- Progress row -->
    <div class="progress-row">
      <div class="q-counter" id="q-counter">Q 1 / 3</div>
      <div class="score-display" id="score-display">Score: 0</div>
    </div>

    <!-- Type badge -->
    <div id="type-badge" class="type-badge">Multiple Choice</div>

    <!-- Question box -->
    <div class="question-box">
      <p id="question-text" class="question-text">Loading...</p>
    </div>

    <!-- Result flash -->
    <div id="result-flash" class="result-flash"></div>

    <!-- MCQ / T-F buttons -->
    <div id="choices" class="choices-grid"></div>

    <!-- Fill in the blank -->
    <div id="fill-section" class="fill-section hidden">
      <div class="fill-label">Your Answer</div>
      <input id="fill-input" class="fill-input" type="text"
             placeholder="Type your answer here..."
             autocomplete="off" spellcheck="false" />
    </div>

    <button id="submit-btn" class="submit-btn">Submit</button>

  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
