<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS Quest - Level Challenge</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional styles for requirement badge */
    .requirement-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 10px;
      margin-bottom: 15px;
      text-align: center;
      border: 2px solid #ffd700;
      box-shadow: 0 4px 0 #4a5568;
      font-family: 'Press Start 2P', monospace;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    
    .requirement-badge span {
      color: #ffd700;
      font-size: 14px;
      margin-right: 8px;
    }
    
    /* Debug console */
    .debug-console {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: monospace;
      font-size: 10px;
      padding: 5px 10px;
      border-radius: 5px;
      z-index: 9999;
      max-width: 300px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  
<audio id="bg-music" loop>
  <source src="music/xDeviruchi - And The Journey Begins .wav" type="audio/wav">
</audio>


<div id="app">
  <div class="game-container">

    <!-- Requirement Badge -->
    <div class="requirement-badge">
      <span>⭐</span> NEED 100% TO UNLOCK NEXT LEVEL! <span>⭐</span>
    </div>

    <!-- Pet Section -->
    <div class="pet-section">
      <div class="pet-sprite">
        <img id="pet-face" src="cat_reactions/blackCatNeutral.png" alt="black_cat" />
      </div>
      <div class="pet-info">
        <div class="pet-name" id="pet-name">Bitsy</div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill" id="hp-bar"></div>
        </div>
        <div class="hp-label" id="hp-label">HP: 75 / 100</div>
      </div>
    </div>

    <!-- Progress Row -->
    <div class="progress-row">
      <div class="q-counter" id="q-counter">Q 1 / 3</div>
      <div class="score-display" id="score-display">Score: 0</div>
    </div>

    <!-- Type Badge -->
    <div id="type-badge" class="type-badge mc">Multiple Choice</div>

    <!-- Question Box -->
    <div class="question-box">
      <p id="question-text" class="question-text">Loading...</p>
    </div>

    <!-- Result Flash -->
    <div id="result-flash" class="result-flash"></div>

    <!-- MCQ / T-F buttons -->
    <div id="choices" class="choices-grid hidden"></div>

    <!-- Fill in the blank -->
    <div id="fill-section" class="fill-section hidden">
      <div class="fill-label">Your Answer</div>
      <input id="fill-input" class="fill-input" type="text"
             placeholder="Type your answer here..."
             autocomplete="off" spellcheck="false" />
    </div>

    <!-- Submit -->
    <button id="submit-btn" class="submit-btn">Submit</button>

  </div>
</div>
<!-- Debug console -->
<div class="debug-console" id="debug-console">
  Console ready...
</div>
<script type="module" src="app.js"></script>
</body>
</html>
