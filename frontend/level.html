<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Paws</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .requirement-badge {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 10px;
      margin-bottom: 15px;
      text-align: center;
      border: 2px solid #ffd700;
      box-shadow: 0 4px 0 #4a5568;
      font-family: "Press Start 2P", monospace;
    }
  </style>
</head>

<body>
  <audio id="bg-music" loop>
    <source
      src="assets/music/xDeviruchi - And The Journey Begins .wav"
      type="audio/wav"
    >
  </audio>

  <div id="app">
    <div class="game-container">
      <div class="requirement-badge">
        NEED 100% TO UNLOCK NEXT LEVEL!
      </div>

      <div class="pet-section">
        <div class="pet-sprite">
          <img
            id="pet-face"
            src="assets/cat_reactions/blackCatNeutral.png"
            alt="Black cat"
          >
        </div>

        <div class="pet-info">
          <div class="pet-name" id="pet-name">Bitsy</div>

          <div class="hp-bar-bg">
            <div class="hp-bar-fill" id="hp-bar"></div>
          </div>

          <div class="hp-label" id="hp-label">
            HP: 75 / 100
          </div>
        </div>
      </div>

      <div class="progress-row">
        <div class="q-counter" id="q-counter">
          Q 1 / 3
        </div>

        <div class="score-display" id="score-display">
          Score: 0
        </div>
      </div>

      <div id="type-badge" class="type-badge mc">
        Multiple Choice
      </div>

      <div class="question-box">
        <p id="question-text" class="question-text">
          Loading...
        </p>
      </div>

      <div id="result-flash" class="result-flash"></div>

      <div id="choices" class="choices-grid hidden"></div>

      <div id="fill-section" class="fill-section hidden">
        <div class="fill-label">
          Your Answer
        </div>

        <input
          id="fill-input"
          class="fill-input"
          type="text"
          placeholder="Type your answer here..."
          autocomplete="off"
          spellcheck="false"
        >
      </div>

      <button id="submit-btn" class="submit-btn">
        Submit
      </button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
